var SD={"S1.1":[{"i":"1.1.1","t":"Cloud models","s":["Public cloud: provider-owned hardware shared by many customers (multitenant), reached over the internet.","Private cloud: dedicated to one organization (single-tenant). It can be on-premises or in a hosting provider’s datacenter.","Hybrid cloud: private/on-premises plus public cloud, connected so workloads can span both.","Multicloud: using more than one public cloud provider."],"k":[["Multitenant","Several customers share the same physical infrastructure, logically isolated from each other."],["Single-tenant","Infrastructure dedicated to one customer."],["Hybrid cloud","A combination of private/on-premises and public cloud environments."]],"x":"A private cloud does not have to be on-premises, and a hybrid cloud does not always include on-premises."},{"i":"1.1.2","t":"Shared responsibility model","s":["The provider always owns the physical datacenter, hosts and network.","The customer always owns their data, accounts/identities and devices, in every service model.","Responsibility for OS, network controls and applications shifts toward the provider as you move IaaS -> PaaS -> SaaS.","On-premises, the customer is responsible for everything."],"k":[["Shared responsibility","Security and operations duties are divided between provider and customer depending on the service model."]],"x":"Even with SaaS you are still responsible for your data and who can access it."},{"i":"1.1.3","t":"Consumption-based model, CapEx and OpEx","s":["CapEx is upfront spending on physical assets such as servers. OpEx is ongoing pay-as-you-go spending.","Cloud mainly shifts spending from CapEx to OpEx.","Consumption-based pricing means you pay only for what you use, with no upfront commitment.","Economies of scale: large providers buy in huge volume, so unit costs are lower and prices can be lower for customers."],"k":[["CapEx","Capital expenditure: upfront purchase of long-lived assets."],["OpEx","Operational expenditure: recurring costs for the services you consume."],["Economies of scale","Lower cost per unit achieved by operating at very large volume."]],"x":"Pay-as-you-go does not mean fixed monthly cost. It follows usage."}],"S1.2":[{"i":"1.2.1","t":"Scalability and elasticity","s":["Scale up (vertical) = give one resource more CPU/RAM. Scale out (horizontal) = add more instances.","Elasticity = resources are added and removed automatically as demand changes.","Autoscale in Azure reacts to metrics, schedules or usage patterns."],"k":[["Scale up","Make an instance larger (more CPU/RAM)."],["Scale out","Add more instances."],["Elasticity","Automatic scaling with demand, in both directions."]],"x":"Scaling is about load. It is not the same thing as fault tolerance."},{"i":"1.2.2","t":"Reliability, high availability and disaster recovery","s":["High availability = the service stays accessible with minimal downtime, usually backed by an SLA.","Fault tolerance = the system keeps running through a component failure, automatically.","Disaster recovery = recovering from a large-scale event, typically by using another region.","Reliability = the ability to recover from failures and continue to function."],"k":[["High availability","Minimal downtime, backed by an SLA."],["Fault tolerance","Continues operating through a component failure."],["Disaster recovery","Restoring service after a major outage, often in another region."]],"x":"Fault tolerance happens without your action. Scaling needs healthy machines and reacts to load."},{"i":"1.2.3","t":"Predictability, security, governance and manageability","s":["Predictability: performance (autoscale, load balancing) and cost (calculators, budgets, alerts).","Security and governance: built-in tools, policies and compliance offerings.","Manageability: manage through the portal, command line, APIs and automated templates."],"k":[["Manageability","Ease of managing and monitoring resources through tools and automation."]],"x":"Predictability covers both performance and cost."}],"S1.3":[{"i":"1.3.1","t":"IaaS, PaaS and SaaS","s":["IaaS: you manage OS, runtime, apps and data. Example: Azure Virtual Machines.","PaaS: you manage your app and data. Examples: Azure App Service, Azure SQL Database.","SaaS: ready-made software, you manage data and users. Example: Microsoft 365."],"k":[["IaaS","Rented infrastructure: virtual machines, storage, networks."],["PaaS","Managed platform to run your code without managing the OS."],["SaaS","Complete application delivered over the internet."]],"x":"VMs are IaaS even though Azure runs the hosts."},{"i":"1.3.2","t":"Serverless","s":["Serverless means you do not provision or manage servers. The platform allocates them on demand.","Billing is typically per execution or per resource consumed.","Azure Functions (code), Logic Apps (workflows) and Event Grid are common serverless services."],"k":[["Serverless","Compute where the platform manages servers and you pay per use."]],"x":"Serverless does not mean no servers exist."}],"S2.1":[{"i":"2.1.1","t":"Regions, geographies and region pairs","s":["Region: a set of datacenters in a latency-defined perimeter (round trip about 2 ms or less), connected by a dedicated network.","Geography: usually a country or area with at least two regions, preserving data residency.","Region pair: a region paired with another in the same geography, generally hundreds of miles apart, for disaster recovery. Updates are rolled out to one region of a pair at a time.","Sovereign clouds (Azure Government, Azure China) are separate instances."],"k":[["Region","Set of datacenters connected with a low-latency network."],["Geography","Area (often a country) that contains at least two regions."],["Region pair","Two regions in the same geography used for disaster recovery."]],"x":"Customers choose a region. They don’t choose individual datacenters."},{"i":"2.1.2","t":"Availability zones","s":["At least three separate zones in zone-enabled regions.","Each zone is one or more datacenters with independent power, cooling and networking.","Zones give high availability and fault tolerance within a region. They do not protect against a whole-region disaster."],"k":[["Availability zone","Physically separate location inside a region with independent power, cooling and network."]],"x":"Zones are not the same as availability sets (racks) or regions."},{"i":"2.1.3","t":"Resource hierarchy: management groups, subscriptions, resource groups","s":["Hierarchy top to bottom: management group -> subscription -> resource group -> resource.","A subscription is the billing and access boundary.","A resource group is a logical container. A resource can be in only one group but can be moved.","Management groups can hold subscriptions and other management groups. Policy and RBAC assigned there are inherited downward."],"k":[["Subscription","Billing and access boundary for Azure resources."],["Resource group","Logical container for related resources."],["Management group","Container above subscriptions for applying policy and access at scale."]],"x":"One resource, one resource group."},{"i":"2.1.4","t":"Azure Resource Manager","s":["ARM is the deployment and management layer. Portal, CLI, PowerShell, SDKs and templates all call it.","ARM authenticates and authorizes each request and applies RBAC, policy and locks.","ARM templates (JSON) and Bicep describe the desired state declaratively."],"k":[["ARM","Azure Resource Manager, the management layer for all Azure requests."],["Bicep","A simpler language that compiles to ARM templates."]],"x":"Every management tool ends up calling ARM."}],"S2.2":[{"i":"2.2.1","t":"Virtual machines, availability sets and scale sets","s":["VMs are IaaS. You choose size and OS and are responsible for patching. Billed while allocated.","Availability set: spreads VMs across fault domains (hardware racks) and update domains (maintenance).","Virtual Machine Scale Sets: identical load-balanced VMs that autoscale out and in.","Typical SLAs: availability set 99.95%, VMs across availability zones 99.99%."],"k":[["Fault domain","A group of hardware that shares a power source and network switch."],["Update domain","A group of VMs that can be rebooted together during maintenance."],["Scale set","A set of identical VMs managed and autoscaled as one."]],"x":"Availability set = racks inside one datacenter. Availability zone = separate datacenters."},{"i":"2.2.2","t":"Containers","s":["Containers package an app with its dependencies and share the host OS kernel, so they start fast and are lightweight.","Azure Container Instances: run a container quickly with no VM or orchestrator to manage.","Azure Kubernetes Service: managed Kubernetes for orchestrating many containers at scale."],"k":[["Container","A lightweight, portable package of an app and its dependencies."],["Orchestration","Automating deployment, scaling and management of many containers."]],"x":"ACI = simple and fast. AKS = orchestration."},{"i":"2.2.3","t":"App hosting, serverless compute and virtual desktops","s":["Azure App Service: PaaS for web apps, REST APIs and mobile backends.","You pay for the App Service plan even if the apps are stopped. Only deleting the plan stops billing.","Azure Functions: event-driven, billed per execution.","Azure Virtual Desktop: cloud-hosted Windows desktops and apps."],"k":[["App Service plan","The compute resources (size and tier) a set of web apps runs on, and what you are billed for."]],"x":"Stopping a web app does not stop the plan’s billing."},{"i":"2.3.1","t":"Virtual networks, subnets, peering and DNS","s":["A virtual network (VNet) is your private network in Azure. Subnets divide it into address ranges.","VNet peering connects VNets (same or different regions) over Microsoft’s backbone, privately.","Azure DNS hosts DNS zones on Azure infrastructure."],"k":[["VNet","Your isolated private network in Azure."],["Subnet","A range of IP addresses within a VNet."],["VNet peering","Private connection between two VNets."]],"x":"Peered VNets communicate using private IP addresses, not the public internet."},{"i":"2.3.2","t":"Hybrid connectivity: VPN Gateway and ExpressRoute","s":["VPN Gateway: encrypted tunnel over the public internet (site-to-site, point-to-site, VNet-to-VNet).","ExpressRoute: private dedicated connection via a connectivity provider (a circuit). It does not use the public internet and offers predictable latency."],"k":[["VPN Gateway","Encrypted connection to Azure over the internet."],["ExpressRoute","Private, dedicated connection to Azure."]],"x":"VPN = over the internet, encrypted. ExpressRoute = private, not over the internet."},{"i":"2.3.3","t":"Load balancing and content delivery","s":["Azure Load Balancer: layer 4 (TCP/UDP).","Application Gateway: layer 7 (HTTP/HTTPS), URL-path routing, SSL termination, optional web application firewall.","Traffic Manager (DNS-based) and Front Door (global layer 7 entry point) route traffic across regions.","CDN caches content close to users."],"k":[["Layer 4","Transport layer, TCP/UDP."],["Layer 7","Application layer, HTTP/HTTPS."]],"x":"Path-based routing = Application Gateway."},{"i":"2.3.4","t":"Network security: NSGs, Azure Firewall and DDoS Protection","s":["Network security group (NSG): allow/deny rules for traffic to subnets or NICs. A lower priority number is processed first (range 100-4096).","Azure Firewall: managed, stateful firewall for VNets.","DDoS Protection: basic protection is automatic and free. A paid tier adds tuning and support.","Azure Bastion: RDP/SSH to VMs through the portal without public IPs."],"k":[["NSG","Rules that filter network traffic to and from Azure resources."],["Stateful firewall","Tracks connection state to recognize legitimate and malicious traffic."]],"x":"Lower priority number wins."}],"S2.3":[{"i":"2.4.1","t":"Storage services and access tiers","s":["Blob: unstructured objects. Files: SMB/NFS file shares. Queue: messages between components. Table: NoSQL key-value. Disk: managed disks for VMs.","Blob access tiers: Hot, Cool, Cold, Archive. Archive is cheapest to store but offline and takes hours to rehydrate."],"k":[["Blob","Object storage for unstructured data."],["Rehydration","Moving a blob out of the Archive tier so it can be read."]],"x":"Archive data cannot be read until rehydrated."},{"i":"2.4.2","t":"Storage redundancy","s":["LRS: three copies in one datacenter.","ZRS: three copies across availability zones in the primary region.","GRS: LRS in the primary region plus LRS in the paired region (six copies).","GZRS: ZRS in the primary plus LRS in the secondary. RA- variants add read access to the secondary."],"k":[["LRS","Locally redundant storage."],["ZRS","Zone-redundant storage."],["GRS","Geo-redundant storage."]],"x":"ZRS protects from a datacenter failure. Only geo options protect from a regional disaster."},{"i":"2.4.3","t":"Moving and migrating data","s":["Azure Migrate: discover, assess and migrate servers, databases and apps.","Azure Data Box: offline physical device for very large transfers.","AzCopy: command-line tool to copy data. Storage Explorer: GUI.","Azure File Sync: sync on-premises file servers with Azure Files."],"k":[["Azure Migrate","Hub for assessing and migrating workloads to Azure."],["AzCopy","Command-line data copy tool."]],"x":"Slow network and huge data: think Data Box."},{"i":"2.5.1","t":"Relational databases","s":["Azure SQL Database: managed relational PaaS. Microsoft handles patching and backups.","Azure SQL Managed Instance: near-100% SQL Server compatibility for lift-and-shift.","SQL Server on a VM: IaaS, full control.","Azure Database for MySQL/PostgreSQL: managed open-source relational databases.","Relational databases scale up easily but do not scale out horizontally like NoSQL."],"k":[["Managed Instance","PaaS with broad SQL Server feature compatibility."]],"x":"Managed Instance, not SQL Database, is the lift-and-shift answer."},{"i":"2.5.2","t":"NoSQL and analytics","s":["Azure Cosmos DB: globally distributed multi-model NoSQL with very low latency and multi-region writes.","Azure Synapse Analytics: analytics and data warehousing.","Data Lake Storage, HDInsight and Databricks support big data processing."],"k":[["Cosmos DB","Globally distributed, multi-model NoSQL database."],["Synapse Analytics","Analytics and data warehouse service."]],"x":"Global distribution with low latency = Cosmos DB."}],"S2.4":[{"i":"2.6.1","t":"Microsoft Entra ID and authentication","s":["Authentication = who are you. Authorization = what can you do.","Microsoft Entra ID (formerly Azure AD): cloud identity and access service. It supports single sign-on (SSO).","MFA needs two or more of: something you know, something you have, something you are.","Passwordless options: Windows Hello, FIDO2 keys, Authenticator app."],"k":[["Entra ID","Cloud-based identity and access management service."],["SSO","Sign in once and access multiple applications."],["MFA","Verification using two or more factor types."]],"x":"Older books call Entra ID ’Azure AD’."},{"i":"2.6.2","t":"Conditional Access and external identities","s":["Conditional Access: if-then policies using signals such as user, location, device and risk. Requires a premium Entra ID tier.","External identities: B2B for guests and partners using their own identity. Customer scenarios let people sign in with existing accounts."],"k":[["Conditional Access","Policy engine that decides access using signals."],["B2B collaboration","Invite external users as guests."]],"x":"Conditional Access is not available on the free tier."},{"i":"2.6.3","t":"Role-based access control","s":["RBAC controls who can do what at a scope (management group, subscription, resource group, resource).","Role assignments are inherited by child scopes and are additive.","A service principal is the identity of an application. A user principal is the identity of a person."],"k":[["Scope","The level at which a role assignment applies."],["Service principal","Security identity for an application."]],"x":"RBAC is about who. Azure Policy is about what is allowed."},{"i":"2.6.4","t":"Defense in depth and Zero Trust","s":["Defense in depth: layered security (physical, identity and access, perimeter, network, compute, application, data).","Zero Trust: verify explicitly, use least-privilege access, assume breach."],"k":[["Defense in depth","Multiple layers so one failure doesn’t expose everything."],["Zero Trust","Never trust, always verify."]],"x":"Zero Trust does not treat the internal network as automatically safe."},{"i":"2.6.5","t":"Security tools: Defender for Cloud, Sentinel and Key Vault","s":["Microsoft Defender for Cloud (formerly Security Center): security posture, secure score, threat protection across Azure and hybrid.","Microsoft Sentinel: cloud-native SIEM and SOAR. Playbooks are built on Logic Apps.","Azure Key Vault: secrets, keys and certificates. Premium tier uses hardware security modules."],"k":[["SIEM","Security information and event management."],["SOAR","Security orchestration, automation and response."]],"x":"Sentinel covers more than Azure: on-premises and other clouds too."}],"S3.1":[{"i":"3.1.1","t":"What affects cost and how to save","s":["Cost factors: resource type and size, region, how you buy (pay-as-you-go, reservations, Enterprise Agreement, CSP) and bandwidth. Inbound data is generally free, outbound is charged.","Savings: reservations and savings plans, Azure Hybrid Benefit, right-sizing, shutting down idle resources, spot capacity.","Free account: initial credit, some always-free services and 12-month free services."],"k":[["Reservation","Commit to a resource for a term in exchange for a discount."],["Azure Hybrid Benefit","Reuse existing licences to lower cost."]],"x":"The cheapest region may cost more overall because cross-region traffic is charged."},{"i":"3.1.2","t":"Pricing Calculator, TCO Calculator and Cost Management","s":["Pricing Calculator: estimate cost of NEW Azure workloads.","TCO Calculator: estimate savings of moving EXISTING on-premises workloads.","Microsoft Cost Management: analyze spend, set budgets and get alerts."],"k":[["TCO","Total cost of ownership: all costs of running something over time."]],"x":"New workload = Pricing Calculator. Migrating = TCO."},{"i":"3.1.3","t":"Tags","s":["Tags are name/value pairs for organizing resources and reporting costs. They appear in billing data.","Tags are not inherited by default."],"k":[["Tag","A name/value pair attached to a resource."]],"x":"Don’t assume child resources inherit a resource group’s tags."},{"i":"3.5.1","t":"Service level agreements","s":["An SLA is Microsoft’s uptime guarantee (for example 99.9%, 99.95%, 99.99%). It covers only issues in Microsoft’s control and may have configuration requirements.","Services in series multiply: 99.9% x 99.9% = about 99.8%.","Redundant parallel paths increase availability above either individual SLA."],"k":[["SLA","Formal availability commitment, with credits if not met."],["Composite SLA","Combined availability of dependent services."]],"x":"Dependencies lower availability. Redundancy raises it."},{"i":"3.5.2","t":"Service lifecycle and support plans","s":["Lifecycle: private preview -> public preview -> general availability (GA). Previews usually have no SLA.","Support plans: Basic (free), Developer, Standard, Professional Direct and Premier (check current offerings). All include 24/7 self-help, Advisor and Service Health.","Technical support cases need a paid plan."],"k":[["General availability","Release for production use with an SLA."],["Public preview","Open evaluation release, generally no SLA."]],"x":"Preview = no SLA, not for production."}],"S3.2":[{"i":"3.2.1","t":"Azure Policy and resource locks","s":["Azure Policy: rules about what is allowed (deny, audit, modify). Example: allowed regions.","Resource locks: CanNotDelete or ReadOnly. They override permissions and are inherited by new child resources.","Creating a lock needs Owner or User Access Administrator."],"k":[["Azure Policy","Defines and enforces standards on resources."],["Resource lock","Prevents accidental deletion or modification."]],"x":"Policy = what resources may look like. RBAC = who may act."},{"i":"3.2.2","t":"Purview, Trust Center and sovereign clouds","s":["Microsoft Purview: data governance and compliance across your data estate.","Trust Center and Service Trust Portal: Microsoft’s compliance, certifications and audit reports.","Azure Government and Azure China: separate sovereign instances for regulatory needs."],"k":[["Service Trust Portal","Library of audit reports and compliance documents."]],"x":"Compliance documents live in the Trust Center and Service Trust Portal."}],"S3.3":[{"i":"3.3.1","t":"Portal, Cloud Shell, CLI and PowerShell","s":["Azure portal: web GUI.","Azure CLI and Azure PowerShell: scripting tools. Both run in Cloud Shell, a browser-based shell whose files persist in a storage account.","PowerShell 6 and 7 and the CLI are cross-platform."],"k":[["Cloud Shell","Browser-based shell with Azure CLI and PowerShell."]],"x":"Cloud Shell needs no local installation."},{"i":"3.3.2","t":"Infrastructure as code and Azure Arc","s":["ARM templates and Bicep: declarative, repeatable deployments.","Azure Arc: project on-premises and other-cloud servers, Kubernetes and data services into Azure so you can manage them from Azure."],"k":[["Infrastructure as code","Defining infrastructure in files so deployments are repeatable."],["Azure Arc","Extends Azure management to resources outside Azure."]],"x":"Arc manages resources outside Azure. It doesn’t move them into Azure."}],"S3.4":[{"i":"3.4.1","t":"Azure Advisor, Service Health and Resource Health","s":["Advisor: personalized recommendations on reliability, security, performance, cost and operational excellence.","Service Health: Azure-wide incidents and planned maintenance affecting you.","Resource Health: the health of your individual resources."],"k":[["Azure Advisor","Recommendation engine for your Azure resources."]],"x":"Service Health = Azure’s problems. Resource Health = your resource’s state."},{"i":"3.4.2","t":"Azure Monitor, Log Analytics and alerts","s":["Azure Monitor collects and analyzes metrics and logs from Azure and on-premises resources.","Log Analytics lets you query log data (using KQL). Alerts notify or trigger actions. Application Insights monitors apps."],"k":[["Log Analytics","Tool for querying and analyzing log data in Azure Monitor."],["KQL","Kusto Query Language."]],"x":"Monitor watches telemetry. Advisor recommends improvements."}]},IQ=[["S1.1",4,"A company keeps sensitive systems in its own datacenter and runs other workloads in Azure, connected together. Which cloud model is this?",["Public cloud","Community cloud","Multicloud","Hybrid cloud"],3,"Hybrid combines on-premises (or private) infrastructure with a public cloud. Multicloud means using more than one public provider."],["S1.1",1,"Which is a characteristic of the public cloud?",["Hardware is owned by the provider and shared by multiple customers (multitenant)","Hardware is dedicated to one organization","Only accessible from inside the corporate network","The customer owns all the physical servers"],0,"Public clouds are multitenant. Logical isolation keeps each customer’s data separate."],["S1.1",4,"A company’s private cloud runs in a hosting provider’s datacenter, entirely dedicated to that one company. Is it still a private cloud?",["No, a private cloud must be on the customer’s own premises","No, anything in a third-party datacenter is public","Yes, because the infrastructure is dedicated to a single organization","Only if the company owns the hardware"],2,"Private means single-tenant, not necessarily owned or on-premises."],["S1.1",3,"Under the shared responsibility model, which item is ALWAYS the customer’s responsibility, even for SaaS?",["The physical datacenter","Their data and who has access to it","The hypervisor and host operating system","The application code of the SaaS product"],1,"Physical security is always the provider’s. Information, data, accounts and identities always stay with the customer."],["S1.1",1,"In an IaaS deployment, who is responsible for patching the guest operating system?",["Microsoft","The datacenter operator only","Nobody, patching is automatic","The customer"],3,"In IaaS you manage the OS and everything above it. Microsoft manages the physical hosts and virtualization."],["S1.1",3,"A company stops buying servers up front and instead pays a monthly bill for the compute it uses. What change in spending is this?",["From capital expenditure (CapEx) to operational expenditure (OpEx)","From OpEx to CapEx","From variable costs to fixed costs","From operating costs to licensing costs only"],0,"Buying hardware up front is CapEx. Pay-as-you-go cloud usage is OpEx."],["S1.1",1,"Which statement best describes the consumption-based model?",["You pay a fixed annual fee for a fixed amount of hardware","You pay nothing until you exceed a free quota every month","You pay only for the resources you actually use","You buy hardware but the provider operates it"],2,"Consumption-based billing means no upfront cost and charges that follow usage."],["S1.1",2,"Why can large cloud providers offer lower unit prices than most individual companies?",["Reserved instances","Economies of scale","Data sovereignty","Hypervisor isolation"],1,"Buying hardware, power and networking in huge volume lowers cost per unit, and the provider passes some of that on."],["S1.2",2,"A web store adds three more identical VMs behind a load balancer to cope with holiday traffic. What is this called?",["Scaling up (vertical scaling)","Fault tolerance","Disaster recovery","Scaling out (horizontal scaling)"],3,"Scaling out adds more instances. Scaling up makes one instance bigger (more CPU or RAM)."],["S1.2",2,"Resources are added automatically when demand rises and removed when demand falls. Which cloud benefit describes this?",["Elasticity","Geo-distribution","Data sovereignty","Reserved capacity"],0,"Elasticity is automatic scaling to match demand, which also keeps you from paying for idle capacity."],["S1.2",2,"A VM host fails and Azure automatically moves your workload to a healthy host without your involvement. Which concept is this?",["Scalability","Elasticity","Fault tolerance","Cost optimization"],2,"Fault tolerance keeps a system running through a component failure. Scaling is about load, not failure."],["S1.2",4,"A company deploys its application in two Azure regions so it can survive a regional outage. Which cloud benefit is this primarily?",["Elasticity","Reliability / disaster recovery","Economies of scale","OpEx accounting"],1,"Deploying across regions lets you recover from large-scale failures."],["S1.2",1,"Which statement best describes high availability?",["Resources are removed automatically when demand drops","Data is copied to an offline device","Costs are fixed regardless of usage","A service stays accessible with minimal downtime, typically backed by an SLA"],3,"High availability is about uptime. Autoscaling down is elasticity."],["S1.2",2,"Using the cost calculator and budget alerts to forecast monthly spend is an example of which cloud benefit?",["Predictability","Elasticity","Geo-distribution","Data sovereignty"],0,"Cost predictability comes from estimating tools, budgets and alerts."],["S1.2",2,"Managing resources through the portal, command line and automated templates is an example of which benefit?",["Fault tolerance","Economies of scale","Manageability","Disaster recovery"],2,"Manageability covers management and automation tooling."],["S1.3",4,"You rent virtual machines and are responsible for the operating system, patching and applications. The provider handles the physical hardware. Which service model is this?",["Platform as a Service (PaaS)","Infrastructure as a Service (IaaS)","Software as a Service (SaaS)","Function as a Service only"],1,"In IaaS the provider runs the datacenter, hardware and virtualization. You manage the OS and everything above it."],["S1.3",1,"Which of the following is an example of Platform as a Service (PaaS)?",["Azure Virtual Machines","Microsoft 365 web email","An on-premises server rack","Azure App Service"],3,"App Service lets you deploy a web app without managing the OS. VMs are IaaS and Microsoft 365 is SaaS."],["S1.3",3,"Which service model would an organization choose to use ready-made email software without installing or maintaining anything?",["SaaS","IaaS","PaaS","On-premises hosting"],0,"SaaS delivers complete applications. You just use them and manage your data and users."],["S1.3",1,"What does ’serverless’ mean in Azure Functions?",["No servers exist anywhere","The code runs only on your local machine","You don’t provision or manage servers, and you pay per execution","You must manage a VM but not the code"],2,"Servers still exist, but the platform allocates and manages them for you."],["S1.3",1,"Which is a typical serverless scenario?",["Host a database server you patch yourself","Resize an image each time one is uploaded to storage","Run a desktop OS for a user","Keep a VM on 24 hours a day"],1,"Event-driven, short-lived code is the classic serverless fit."],["S2.1",1,"What is an Azure region?",["A single physical datacenter building","A group of subscriptions","A billing zone only","A set of datacenters deployed within a latency-defined perimeter and connected by a dedicated low-latency network"],3,"A region contains one or more datacenters. A geography contains at least two regions."],["S2.1",1,"What is the purpose of Azure region pairs?",["Each region is paired with another in the same geography for disaster recovery and platform updates","To balance load between two virtual networks","To pair two subscriptions for billing","To connect on-premises networks to Azure"],0,"Pairs are generally hundreds of miles apart and updated sequentially to limit downtime."],["S2.1",1,"How many regions does an Azure geography contain?",["Exactly one","Exactly three","At least two","Only one per country, always"],2,"Each geography has at least two regions, which enables disaster recovery inside the same compliance boundary."],["S2.1",1,"What do availability zones provide?",["Copies of your data in another country","Physically separate datacenters within a region, each with independent power, cooling and networking","Separate subscriptions for billing","A way to reduce VM size"],1,"Zones protect against a datacenter-level failure. They do not protect against a whole-region disaster."],["S2.1",3,"A company wants its application to survive the loss of a single datacenter within a region. Which feature should it use?",["Management groups","Azure Advisor","Resource tags","Availability zones"],3,"Deploying across availability zones keeps the app running if one zone fails."],["S2.1",1,"How many resource groups can a single Azure resource belong to at the same time?",["One","Two","As many as you want","Zero, resources are not in groups"],0,"A resource lives in exactly one resource group, but it can be moved to another."],["S2.1",1,"What can be placed inside an Azure management group?",["Only resource groups","Only individual resources","Subscriptions and other management groups","Only virtual networks"],2,"Management groups sit above subscriptions and let you apply policy and access control at scale."],["S2.1",1,"Which is the correct hierarchy from top to bottom?",["Subscription, management group, resource, resource group","Management group, subscription, resource group, resource","Resource group, management group, subscription, resource","Resource, resource group, subscription, management group"],1,"Management groups sit above subscriptions, which contain resource groups, which contain resources."],["S2.1",2,"Which Azure service is the deployment and management layer that all portal, CLI and template actions go through?",["Azure Arc","Azure Monitor","Azure Advisor","Azure Resource Manager (ARM)"],3,"Whatever tool you use, requests reach ARM, which authenticates and applies them."],["S2.1",1,"How do ARM templates describe resources?",["Declaratively, by defining the desired end state","Imperatively, by listing the exact step-by-step commands","Only through the portal","By recording mouse clicks"],0,"Declarative templates say what you want. ARM works out how to get there."],["S2.2",4,"You want two VMs placed on different physical racks in a datacenter so one hardware failure doesn’t take both down. What do you use?",["A resource lock","A management group","An availability set","A VPN gateway"],2,"Availability sets spread VMs across fault domains (hardware) and update domains (maintenance)."],["S2.2",3,"Which Azure service lets you create and manage a group of identical, load-balanced VMs that can autoscale?",["Azure Container Instances","Virtual Machine Scale Sets","Azure Blueprints","Azure Files"],1,"Scale sets add and remove identical VM instances based on rules or schedules."],["S2.2",1,"When is a virtual machine a better fit than Azure App Service?",["When you want Microsoft to patch the OS for you","When you only need to host a simple web API","When you want billing per execution","When you need full control of the operating system and installed software"],3,"VMs give control but also responsibility. App Service is PaaS."],["S2.2",3,"You want the quickest way to run a single container in Azure without managing any VMs or orchestrators. Which service fits?",["Azure Container Instances (ACI)","Azure Kubernetes Service (AKS)","Azure Virtual Machines","Azure SQL Database"],0,"ACI starts containers quickly with no orchestration. AKS is for orchestrating many containers."],["S2.2",1,"Which service orchestrates deployment, scaling and management of many containers?",["Azure App Service","Azure Functions","Azure Kubernetes Service (AKS)","Azure DNS"],2,"AKS is managed Kubernetes. Azure manages the control plane."],["S2.2",2,"Which service runs small pieces of code in response to events (such as a new blob or an HTTP call) and bills per execution?",["Azure Virtual Desktop","Azure Functions","Azure Data Box","Azure Policy"],1,"Functions is Azure’s event-driven serverless compute."],["S2.2",2,"Which Azure service delivers virtualized Windows desktops and apps to users from the cloud?",["Azure Bastion","Azure Front Door","Azure Sphere","Azure Virtual Desktop"],3,"AVD is desktop and app virtualization hosted in Azure."],["S2.2",3,"You stop every web app in an App Service plan. What happens to billing?",["You are still billed for the plan until you delete it","Billing stops immediately","You are billed only for storage","You are billed per execution"],0,"The plan reserves compute, so it is charged until it is deleted."],["S2.2",2,"Which feature lets resources in two virtual networks communicate privately over the Microsoft backbone?",["Azure DNS","Azure Policy","Virtual network peering","Resource locks"],2,"Peering links VNets so traffic stays on Microsoft’s network."],["S2.2",1,"What is a subnet?",["A separate Azure subscription","A range of IP addresses within a virtual network used to segment it","A type of storage redundancy","A load balancing rule"],1,"Subnets segment a VNet and are where you attach resources and NSGs."],["S2.2",4,"A company needs a private connection from its datacenter to Azure that does NOT travel over the public internet. What should it use?",["Site-to-site VPN over the internet","Azure DNS","Azure CDN","Azure ExpressRoute"],3,"ExpressRoute uses a dedicated connection through a connectivity provider. A VPN Gateway uses encrypted tunnels over the internet."],["S2.2",3,"A branch office needs a quick, low-cost encrypted connection to Azure over the internet. Which service fits?",["Azure VPN Gateway","Azure ExpressRoute","Azure Data Box","Azure Files"],0,"VPN Gateway is the internet-based option. ExpressRoute needs a provider circuit and costs more."],["S2.2",1,"Which service routes HTTP requests to different backend pools based on the URL path?",["Azure Load Balancer","Azure ExpressRoute","Azure Application Gateway","Azure VPN Gateway"],2,"Application Gateway is a layer 7 load balancer. Azure Load Balancer works at layer 4 (TCP/UDP)."],["S2.2",1,"Which service caches static content on servers close to users to reduce latency?",["Azure Policy","Azure Content Delivery Network (CDN)","Azure Key Vault","Azure Bastion"],1,"A CDN serves cached content from edge locations."],["S2.2",1,"Two NSG rules conflict. Which one applies?",["The rule with the higher priority number","The rule created first","Both are applied equally","The rule with the lower priority number"],3,"NSG rules are evaluated in priority order, and the first match is applied."],["S2.2",1,"Which service is a managed, stateful network firewall for virtual networks?",["Azure Firewall","Azure Advisor","Azure Cost Management","Azure Files"],0,"Azure Firewall provides centrally managed, stateful filtering."],["S2.3",2,"Which storage service holds unstructured data such as images, video and backups as objects?",["Azure Files","Azure Queue Storage","Azure Blob Storage","Azure Table Storage"],2,"Blob Storage is Azure’s object storage. Files provides SMB/NFS file shares."],["S2.3",1,"Which service provides fully managed file shares accessible over the SMB protocol?",["Azure Blob Storage","Azure Files","Azure Disk Storage","Azure Cosmos DB"],1,"Azure Files can be mounted on Windows, Linux and macOS."],["S2.3",2,"Which Blob access tier has the lowest storage cost but requires rehydration before data can be read?",["Hot","Cool","Premium","Archive"],3,"Archive is for rarely accessed data and takes hours to rehydrate."],["S2.3",2,"Which redundancy option keeps three synchronous copies across availability zones in the primary region?",["Zone-redundant storage (ZRS)","Locally redundant storage (LRS)","Read-access geo-redundant storage (RA-GRS)","Premium SSD only"],0,"LRS keeps three copies inside one datacenter. ZRS spreads them across zones. GRS adds a copy in a paired region."],["S2.3",1,"Which redundancy option also keeps a copy in the paired region?",["Locally redundant storage (LRS)","Zone-redundant storage (ZRS)","Geo-redundant storage (GRS)","Premium SSD"],2,"GRS replicates to a secondary region for regional disaster protection."],["S2.3",3,"A company needs to ship tens of terabytes to Azure using a physical device because its network is too slow. Which service fits?",["Azure Monitor","Azure Data Box","Azure Cost Management","Azure Advisor"],1,"Data Box is a rugged offline transfer device you send back to Microsoft."],["S2.3",1,"Which service synchronizes an on-premises Windows file server with Azure Files?",["Azure Data Box","Azure DNS","Azure Bastion","Azure File Sync"],3,"File Sync keeps on-premises servers and an Azure file share in sync."],["S2.3",2,"Which service offers near-100% SQL Server compatibility as a managed PaaS, ideal for lifting and shifting existing SQL Server workloads?",["Azure SQL Managed Instance","Azure Cosmos DB","Azure Table Storage","Azure Blob Storage"],0,"Managed Instance supports instance-level features such as SQL Agent and cross-database queries."],["S2.3",1,"Which statement about Azure SQL Database is true?",["You must patch the operating system yourself","It stores unstructured files only","It is a PaaS service where Microsoft manages patching and backups","It is available only on-premises"],2,"Azure SQL Database is fully managed PaaS."],["S2.3",2,"Which database service is a globally distributed, multi-model NoSQL database with single-digit millisecond latency?",["Azure SQL Database","Azure Cosmos DB","Azure Database for MySQL","Azure Synapse Analytics"],1,"Cosmos DB supports multiple APIs and multi-region writes."],["S2.3",1,"Which service is designed for large-scale analytics and data warehousing?",["Azure Table Storage","Azure Bastion","Azure DNS","Azure Synapse Analytics"],3,"Synapse brings data warehousing and big data analytics together."],["S2.4",2,"Which service is Azure’s cloud-based identity and access management service (formerly Azure Active Directory)?",["Microsoft Entra ID","Azure Key Vault","Azure Policy","Azure Monitor"],0,"Entra ID handles sign-in and access. Older books call it Azure AD."],["S2.4",1,"Sign-in requires a password plus a code from a phone app. What is this called?",["Single sign-on (SSO)","Role-based access control","Multifactor authentication (MFA)","Federation"],2,"MFA requires two or more of: something you know, have or are."],["S2.4",1,"What does single sign-on (SSO) allow?",["Users share one password","Users sign in once and access multiple applications without re-entering credentials","Users skip authentication","Admins see passwords in plain text"],1,"SSO reduces password fatigue and improves security when combined with MFA."],["S2.4",2,"Which feature enforces if-then rules such as ’require MFA when a user signs in from an unfamiliar location’?",["Azure Policy","Resource locks","Network security groups","Conditional Access"],3,"Conditional Access uses signals (user, location, device, risk) to decide whether to grant, block or require extra checks."],["S2.4",3,"Which Entra ID capability lets you invite users from another company to collaborate using their own identity?",["B2B collaboration (external identities)","Azure Bastion","Resource tags","Azure DDoS Protection"],0,"B2B invites guest users. B2C is for customer-facing apps."],["S2.4",1,"Which service controls WHO can do WHAT on Azure resources at a given scope?",["Azure Policy","Azure Advisor","Azure role-based access control (RBAC)","Azure DNS"],2,"RBAC assigns roles to security principals at management group, subscription, resource group or resource scope, and these are inherited downward."],["S2.4",2,"A user is assigned the Reader role at a subscription. What access do they have to a VM in a resource group in that subscription?",["No access","Reader, inherited from the subscription","Contributor","Owner"],1,"Role assignments flow down to child scopes."],["S2.4",1,"What does ’defense in depth’ mean?",["Relying on a single strong firewall","Encrypting only data at rest","Allowing access based on network location alone","Using multiple layers of security so one failure doesn’t expose everything"],3,"Layers include physical, identity, perimeter, network, compute, application and data."],["S2.4",1,"Which principle states ’never trust, always verify’?",["Zero Trust","Least privilege only","Perimeter security","Shared responsibility"],0,"Zero Trust verifies explicitly, uses least privilege and assumes breach."],["S2.4",2,"Which service provides a secure score, posture management and threat protection for Azure and hybrid workloads?",["Azure DNS","Azure Cost Management","Microsoft Defender for Cloud","Azure Files"],2,"Defender for Cloud was formerly called Azure Security Center. Older books use that name."],["S2.4",1,"Which service is a cloud-native SIEM and SOAR solution?",["Azure Key Vault","Microsoft Sentinel","Azure Bastion","Azure Advisor"],1,"Sentinel collects security data, detects threats and automates response."],["S2.4",2,"Where should an application store connection strings, API keys and certificates securely?",["Azure Blob Storage with public access","A tag on the resource group","Azure DNS records","Azure Key Vault"],3,"Key Vault centralizes secrets, keys and certificates with access control and logging."],["S3.1",1,"Which of these factors affects Azure costs?",["Region, resource type and outbound data transfer","Only the size of the Azure subscription ID","The colour theme in the portal","The number of Entra ID users only"],0,"Cost depends on what you deploy, where, how you buy it and bandwidth. Inbound data is generally free, outbound is charged."],["S3.1",3,"Which Azure subscription type lets a new customer try services with free credit for a limited time?",["Enterprise Agreement","Cloud Solution Provider only","Azure free account","Azure R var QBX={};QB.forEach(function(q){QBX[q[2]]=q});
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}

function now(){return Date.now()+S.skew*864e5}
var SMAX=30;
function Z(id){var z=S.z[id]||(S.z[id]={s:0,st:1,t:now(),peak:1,sc:0,sw:0,nudge:0,n:0});if(z.st>SMAX)z.st=SMAX;return z}
function ago(z){return(now()-z.t)/864e5}
function mult(z){return 1+2*Math.pow(z.s/100,3)}
function ret(z){return Math.exp(-ago(z)*mult(z)/z.st)}
function eff(z){return z.s*ret(z)}
function lvl(z){return Math.max(1,Math.min(10,Math.floor(eff(z)/10)+1))}
function glow(z){if(z.n===0)return"New";var r=ret(z);return r>=.8?"Fresh":r>=.5?"Steady":r>=.25?"Fading":"Forgotten"}
function tier(z){return Math.max(1,Math.min(5,Math.ceil(lvl(z)/2)+z.nudge))}
function zonesOf(p){return ZN.filter(function(z){return z[1]===p})}
function prevOf(p){return p==="P2"?"P1":p==="P3"?"P2":null}
function gateOk(z){if(lvl(z)>=5)return true;return z.s>=40&&ago(z)-z.st*Math.log(z.s/40)/mult(z)<1}
function weakest(p){return zonesOf(p).sort(function(a,b){return eff(Z(a[0]))-eff(Z(b[0]))})[0]}
function gate(p){var q=prevOf(p);if(!q||S.unl)return"Open";if(gate(q)==="Sealed")return"Sealed";
 var zs=zonesOf(q).map(function(z){return Z(z[0])});if(!zs.every(gateOk))return"Sealed";
 return zs.some(function(z){var g=glow(z);return g==="Fading"||g==="Forgotten"||(lvl(z)===5&&ret(z)<.6)})?"Trembling":"Open"}
function gstate(p){var s=gate(p);if(s!=="Sealed")S.op[p]=1;return s==="Sealed"&&!S.op[p]?"Locked":s}
function pickFrom(pool,t,used){var p=pool.filter(function(q){return used.indexOf(q)<0});if(!p.length)p=pool;
 return p.map(function(q){return{q:q,d:Math.abs(q[1]-t)-(S.mk[q[2]]?1.2:0)+Math.random()*.6}}).sort(function(a,b){return a.d-b.d})[0].q}

function adv(zid){var zn=ZN.filter(function(z){return z[0]===zid})[0],pool=QB.filter(function(q){return q[0]===zid&&q[1]>=4});
 run({title:"Advanced mix: "+zn[0]+" "+zn[2],N:8,base:5,cap:7,maxT:7,sel:function(t,u){return{z:zid,q:pickFrom(pool,t,u)}},after:function(){var z=Z(zid);return zn[0]+" is now level "+lvl(z)+" ("+glow(z)+")."}})}
function answer(zid,ok,tr,q){var z=Z(zid),cur=eff(z),pt=tier(z),mk=S.mk;
 if(ok){z.s=Math.min(100,cur+GAIN[tr]);z.st*=(tr>=pt?2:1.5);z.sc++;z.sw=0;if(z.sc>=3){z.nudge=Math.min(2,z.nudge+1);z.sc=0}}
 else{z.s=Math.max(0,cur-PEN[tr]);z.st=Math.max(.5,z.st*.5);z.sw++;z.sc=0;if(z.sw>=2){z.nudge=Math.max(-2,z.nudge-1);z.sw=0}}
 if(q){var m=mk[q[2]];if(ok){if(m){m.c++;if(m.c>=2)delete mk[q[2]]}}else mk[q[2]]={z:q[0],w:(m?m.w:0)+1,c:0}}
 z.st=Math.min(z.st,SMAX);z.n++;z.t=now();z.peak=Math.max(z.peak,lvl(z));save()}

  h+='</div></div>'});
 var M=Z("MX"),op=mixOpen(),dn=ZN.filter(function(z){return Z(z[0]).peak>=10}).length;

 app.innerHTML=h;save();

function run(o){var d=Math.max(1,o.base-.6),used=[],k=0,right=0,wrong=0,hue=Math.floor(Math.random()*360);
 function end(){app.innerHTML='<div class="card"><b>'+o.title+' complete: '+right+' of '+o.N+' correct</b><p>'+o.after()+'</p><p class="small">Mistake Notebook: '+Object.keys(S.mk).length+' saved.</p><button id="bk">Back to map</button></div>';document.getElementById("bk").onclick=map}
